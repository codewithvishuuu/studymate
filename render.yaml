# StudyMate Render blueprint. DO NOT deploy without reading the storage warning
# in README.md ("Deployment (Render)"): backend/data/ is ephemeral unless the
# persistent disk below is attached (requires a paid instance).
services:
  - type: web
    name: studymate-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false # set as a secret in the Render dashboard; never commit
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: FRONTEND_URL
        value: https://studymate-frontend.onrender.com # replace with the real frontend URL (CORS allowlist)
    disk:
      name: studymate-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  - type: web
    name: studymate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://studymate-backend.onrender.com # replace with the real backend URL (baked in at build time)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
